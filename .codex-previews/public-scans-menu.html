<div id="public-scans-preview">
  <style>
    #public-scans-preview {
      color-scheme: light;
      background: #fff;
      display: grid;
      gap: 16px;
      padding: 18px;
      color: light-dark(#334155, #e2e8f0);
      font: 14px system-ui, sans-serif;
    }
    #public-scans-preview .state { display: block; margin-bottom: 7px; }
    #public-scans-preview .menu {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border: 1px solid light-dark(#e2e8f0, #334155);
      border-radius: 12px;
      background: light-dark(#fff, #151b26);
    }
    #public-scans-preview .actions,
    #public-scans-preview .profile {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #public-scans-preview .logo {
      display: grid;
      place-items: center;
      width: 36px;
      height: 34px;
      border-radius: 9px;
      background: light-dark(#e7331d, #dc341f);
      color: #fff;
      box-shadow: inset 0 -3px rgb(0 0 0 / 25%);
    }
    #public-scans-preview .scans {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-inline-end: 6px;
      padding-block: 9px;
      font-weight: 500;
      white-space: nowrap;
    }
    #public-scans-preview .scans[aria-current="page"] {
      color: light-dark(#0f172a, #f8fafc);
      text-decoration: underline;
      text-underline-offset: 5px;
    }
    #public-scans-preview .profile {
      padding: 5px 8px;
      border-radius: 24px;
      background: light-dark(#f4f4f5, #263143);
    }
    #public-scans-preview .avatar {
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: light-dark(#e2e8f0, #3b4b64);
    }
    #public-scans-preview .actions svg { width: 16px; height: 16px; }
  </style>
  <section aria-label="Checker menu">
    <span class="state">On the checker</span>
    <div class="menu">
      <span class="logo" role="img" aria-label="Checker logo"><i data-lucide="check" aria-hidden="true"></i></span>
      <div class="actions">
        <span class="scans"><i data-lucide="chart-no-axes-column-increasing" aria-hidden="true"></i><span>Public Scans</span></span>
        <span class="profile" role="img" aria-label="Profile menu"><span class="avatar"><i data-lucide="user-round" aria-hidden="true"></i></span><i data-lucide="chevron-down" aria-hidden="true"></i></span>
      </div>
    </div>
  </section>
  <section aria-label="Public Scans menu">
    <span class="state">On Public Scans</span>
    <div class="menu">
      <span class="logo" role="img" aria-label="Checker logo"><i data-lucide="check" aria-hidden="true"></i></span>
      <div class="actions">
        <span class="scans" aria-current="page"><i data-lucide="chart-no-axes-column-increasing" aria-hidden="true"></i><span>Public Scans</span></span>
        <span class="profile" role="img" aria-label="Profile menu"><span class="avatar"><i data-lucide="user-round" aria-hidden="true"></i></span><i data-lucide="chevron-down" aria-hidden="true"></i></span>
      </div>
    </div>
  </section>
</div>
